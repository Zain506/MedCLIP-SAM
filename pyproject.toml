[project]
name = "MedCLIP-SAM"
version = "0.0.1"
description = "Reimplement the MedCLIP-SAM pipeline from its research paper"
authors = [{ name = "Zain", "email" = "nomani.zain@gmail.com"}]
requires-python = ">=3.10"
dependencies = ["transformers","python-dotenv","datasets"]

[project.optional-dependencies]
dev = ["ruff","black","pre-commit","pytest","nbstripout","mypy", "jupyterlab", "jupyterlab_vim"]
training = ["open-clip-torch", "torch", "tqdm"]

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = "py310"
